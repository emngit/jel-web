<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pixel Badge Generator</title>
  <style>
    body {
      background: #0d1117;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: -apple-system, "Segoe UI", sans-serif;
      color: #e6edf3;
    }
    h1 { font-size: 18px; margin-bottom: 16px; color: #7d8590; }
    #controls {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    label { font-size: 13px; color: #7d8590; }
    input[type=range] { accent-color: #39d353; cursor: pointer; }
    button {
      background: #238636;
      color: #fff;
      border: none;
      padding: 6px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background: #2ea043; }
    canvas { image-rendering: pixelated; }
    #output {
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 16px;
      background: #161b22;
    }
    #sizeLabel { font-size: 13px; color: #7d8590; min-width: 80px; }
    a {
      margin-top: 16px;
      color: #39d353;
      font-size: 13px;
    }
  </style>
</head>

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const slider = document.getElementById('gridSlider');
  const sizeLabel = document.getElementById('sizeLabel');
  const downloadBtn = document.getElementById('downloadBtn');

  const CELL = 13;   // pixel block size in output
  const GAP = 3;     // gap between blocks

  function toGrayscale(r, g, b) {
    return 0.299 * r + 0.587 * g + 0.114 * b;
  }

  function render(gridSize) {
    sizeLabel.textContent = `${gridSize} × ${gridSize}`;

    // Sample the image into a small grid
    const tmp = document.createElement('canvas');
    tmp.width = gridSize;
    tmp.height = gridSize;
    const tmpCtx = tmp.getContext('2d');
    tmpCtx.drawImage(img, 0, 0, gridSize, gridSize);
    const data = tmpCtx.getImageData(0, 0, gridSize, gridSize).data;

    const totalSize = gridSize * (CELL + GAP) + GAP;
    canvas.width = totalSize;
    canvas.height = totalSize;

    // Background
    ctx.fillStyle = '#0d1117';
    ctx.fillRect(0, 0, totalSize, totalSize);

    for (let row = 0; row < gridSize; row++) {
      for (let col = 0; col < gridSize; col++) {
        const idx = (row * gridSize + col) * 4;
        const r = data[idx], g = data[idx + 1], b = data[idx + 2];
        const gray = toGrayscale(r, g, b);

        // Map grayscale (0–255) → inverted brightness → 5 GitHub color levels
        // Darker pixels (hair, clothes) → more contribution (brighter green)
        // Lighter pixels (bg, skin) → less contribution (darker/empty)
        let level;
        const inv = 255 - gray; // invert so dark areas = more activity
        if (inv < 40)       level = 0;
        else if (inv < 100) level = 1;
        else if (inv < 155) level = 2;
        else if (inv < 210) level = 3;
        else                level = 4;

        const x = GAP + col * (CELL + GAP);
        const y = GAP + row * (CELL + GAP);

        ctx.fillStyle = GITHUB_COLORS[level];
        ctx.beginPath();
        ctx.roundRect(x, y, CELL, CELL, 2);
        ctx.fill();
      }
    }
  }

  img.onload = () => render(parseInt(slider.value));

  slider.addEventListener('input', () => render(parseInt(slider.value)));

  downloadBtn.addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = 'pixel-badge.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
</script>
